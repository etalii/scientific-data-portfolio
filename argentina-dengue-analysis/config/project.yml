project:

  name: "Argentina Dengue Analysis"

  version: "0.1"

api:

  package_show_url: "https://datos.gob.ar/api/3/action/package_show"

dataset:

  id: "vigilancia-de-las-enfermedades-por-virus-del-dengue-y-zika"

  preferred_format: "CSV"

selection:

  required_resource_state: "active"

directories:

  raw_data: "data/raw"

  processed_data: "data/processed"

  figures: "figures"

  metadata: "data/metadata"

  download_staging: "outputs/download_staging"

  population_raw: "data/raw/population"

  population_staging: "outputs/population_staging"

  reference_data: "data/reference"

artifacts:

  resources_catalog: "data/metadata/resources_catalog.csv"

  acquisition_validation_lock: "data/metadata/.argentina_dengue_acquisition_validation.lock"

  validation_snapshot: "data/metadata/validation_snapshot.csv"

  canonical_resources: "data/metadata/canonical_resources.csv"

  canonical_resources_structural: "data/processed/canonical_resources_structural.csv"

  harmonized_quality_snapshot: "data/metadata/harmonized_quality_snapshot.csv"

  primary_dengue_analysis_rows: "data/processed/primary_dengue_analysis_rows.csv"

  analysis_weekly_national: "data/processed/analysis_weekly_national.csv"

  analysis_province_summary: "data/processed/analysis_province_summary.csv"

  analysis_weekly_province: "data/processed/analysis_weekly_province.csv"

  analysis_age_group_summary: "data/processed/analysis_age_group_summary.csv"

  dengue_2024_weekly_national_figure: "figures/dengue_2024_weekly_national.png"

  dengue_2024_province_ranking_figure: "figures/dengue_2024_province_ranking.png"

  dengue_2024_top5_provinces_weekly_figure: "figures/dengue_2024_top5_provinces_weekly.png"

  dengue_2024_age_group_composition_figure: "figures/dengue_2024_age_group_composition.png"

  multiyear_dengue_scopes: "data/processed/multiyear_dengue_scopes.csv"

  multiyear_dengue_weekly_national: "data/processed/multiyear_dengue_weekly_national.csv"

  multiyear_dengue_province_summary: "data/processed/multiyear_dengue_province_summary.csv"

  multiyear_dengue_weekly_province: "data/processed/multiyear_dengue_weekly_province.csv"

  multiyear_dengue_age_summary: "data/processed/multiyear_dengue_age_summary.csv"

  multiyear_comparability_snapshot: "data/metadata/multiyear_comparability_snapshot.csv"

  population_source_provenance: "data/metadata/population_source_provenance.csv"

  population_denominators: "data/reference/population_denominators.csv"

  population_reference_lock: "data/metadata/.argentina_dengue_population_reference.lock"

logs:

  download: "data/metadata/download_log.csv"

download:

  timeout_seconds: 60

  max_retries: 3

  retry_backoff_seconds: 2

canonicalization:

  header_encodings:
    - "UTF-8"
    - "latin1"

  temporal_column_pairs:
    - year_column: "ano"
      week_column: "semanas_epidemiologicas"
    - year_column: "año"
      week_column: "semanas_epidemiologicas"
    - year_column: "anio_min"
      week_column: "sepi_min"

harmonization:

  body_encodings:
    - "UTF-8"
    - "latin1"

analysis_scope:
  primary:
    scope_id: "primary_dengue_2024"
    source_years:
      - 2024
    events:
      - "Dengue"

multiyear_scope:
  source_years:
    - 2018
    - 2022
    - 2024
    - 2025

  event: "Dengue"

population_reference:
  required_years:
    indec_census_2010_projection_2010_2040: [2018, 2022, 2024, 2025]
    indec_census_2022_projection_2022_2040: [2022, 2024, 2025]

  sources:
    indec_census_2022_projection_2022_2040:
      source_resource_identifier: "indec_proyecciones_jurisdiccionales_2022_2040_c1"
      source_authority: "INDEC"
      source_title: "Población estimada al 1 de julio, por sexo, según año calendario. Total del país y jurisdicciones. Años 2022-2040"
      source_landing_url: "https://www.indec.gob.ar/indec/web/Nivel4-Tema-2-24-85"
      expected_filename: "proyecciones_jurisdicciones_2022_2040_c1.xlsx"
      accepted_formats: ["xlsx"]
      census_basis: "Censo Nacional de Población, Hogares y Viviendas 2022"
      workbook:
        national_sheet: "01-TOTAL DEL PAÍS"
        province_sheet_pattern: "^[0-9]{2}-"
        header_skip: 3
        required_columns: ["Año", "Ambos sexos", "Varones", "Mujeres"]
    indec_census_2010_projection_2010_2040:
      source_resource_identifier: "indec_proyecciones_provinciales_2010_2040"
      source_authority: "INDEC"
      source_title: "Población estimada al 1 de julio según año calendario por sexo para el total del país y provincias. Años 2010-2040"
      source_landing_url: "https://www.indec.gob.ar/indec/web/Institucional-Indec-InformacionDeArchivo-1"
      expected_filename: "c1_proyecciones_prov_2010_2040.xls"
      accepted_formats: ["xls"]
      census_basis: "Censo Nacional de Población, Hogares y Viviendas 2010"
      workbook:
        national_sheet: "01-TOTAL DEL PAÍS"
        province_sheet_pattern: "^[0-9]{2}-"
        header_skip: 3
        required_columns: ["Año", "Ambos sexos", "Varones", "Mujeres"]

visualization:
  png_resolution_dpi: 150
