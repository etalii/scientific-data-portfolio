published_count_rate:
  scenarios:
    contemporary:
      "2018": "indec_census_2010_projection_2010_2040"
      "2022": "indec_census_2022_projection_2022_2040"
      "2024": "indec_census_2022_projection_2022_2040"
      "2025": "indec_census_2022_projection_2022_2040"
    sensitivity_interannual:
      "2018": "indec_census_2010_projection_2010_2040"
      "2022": "indec_census_2010_projection_2010_2040"
      "2024": "indec_census_2010_projection_2010_2040"
      "2025": "indec_census_2010_projection_2010_2040"
  ben_region_order: ["Centro", "Cuyo", "NEA", "NOA", "Sur"]

epidemiological_season:
  scope_id: "dengue_season_2024_2025_se31_30"
  season_label: "SE31/2024–SE30/2025"
  event: "Dengue"
  segments:
    - source_year: 2024
      week_start: 31
      week_end: 52
    - source_year: 2025
      week_start: 1
      week_end: 30

visualization:
  png_resolution_dpi: 150
