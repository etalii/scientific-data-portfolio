  indec_geographic_reference_document: "INDEC CODGEO: Definiciones"
  indec_geographic_reference_url: "https://geoservicios.indec.gob.ar/codgeo/index.php?pagina=definiciones"
  indec_jurisdictions:
    "02": "CABA"
    "06": "Buenos Aires"
    "10": "Catamarca"
    "14": "Córdoba"
    "18": "Corrientes"
    "22": "Chaco"
    "26": "Chubut"
    "30": "Entre Ríos"
    "34": "Formosa"
    "38": "Jujuy"
    "42": "La Pampa"
    "46": "La Rioja"
    "50": "Mendoza"
    "54": "Misiones"
    "58": "Neuquén"
    "62": "Río Negro"
    "66": "Salta"
    "70": "San Juan"
    "74": "San Luis"
